<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Каракули — Регистрация</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="register">
<noscript>Для работы Каракули нужен включённый JavaScript.</noscript>
<main class="auth">
  <div class="card auth-box">
    <form class="auth-form" id="reg-form" novalidate>
      <span data-logo></span>
      <h1>Регистрация</h1>
      <div class="form-grid">
        <div class="form-row"><label for="first">Имя</label><input class="input" id="first" name="first" maxlength="30" autocomplete="given-name" required></div>
        <div class="form-row"><label for="last">Фамилия</label><input class="input" id="last" name="last" maxlength="30" autocomplete="family-name" required></div>
      </div>
      <div class="form-row"><label for="email">Электронная почта</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="form-row"><label for="pass">Пароль</label><input class="input" id="pass" name="pass" type="password" autocomplete="new-password" placeholder="Не короче 6 символов" required></div>
      <div class="form-row"><label for="pass2">Повторите пароль</label><input class="input" id="pass2" name="pass2" type="password" autocomplete="new-password" required></div>
      <div class="form-msg err" id="msg" role="alert"></div>
      <button class="btn" type="submit">Зарегистрироваться</button>
      <div class="auth-links"><span class="muted">Уже есть страница?</span><a href="login.html">Войти</a></div>
      <div id="social"></div>
    </form>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
