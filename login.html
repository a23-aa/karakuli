<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Каракули — Вход</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login">
<noscript>Для работы Каракули нужен включённый JavaScript.</noscript>
<main class="auth">
  <div class="card auth-box">
    <form class="auth-form" id="login-form" novalidate>
      <span data-logo></span>
      <h1>Вход</h1>
      <div class="form-row"><label for="email">Электронная почта</label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="form-row"><label for="pass">Пароль</label><input class="input" id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Ваш пароль" required></div>
      <div class="form-msg err" id="msg" role="alert"></div>
      <button class="btn" type="submit">Войти</button>
      <div class="auth-links"><a href="#" id="forgot">Забыли пароль?</a><a href="register.html">Создать страницу</a></div>
      <div id="social"></div>
    </form>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
